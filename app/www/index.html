<style>
  /* Layout: one portrait 9:16 stage centred on an ink ground; the game is drawn on canvas, menus are HTML over it. */
  :root {
    --ink: #24221f;
    --ink2: #2b2a28;
    --paper: #f3e9d2;
    --paper2: #e9dcbf;
    --vermilion: #c8442f;
    --moss: #5e7d4a;
    --sakura: #f2b8c6;
    --gold: #d9a441;
    --muted: rgba(43,42,40,.62);
    --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    --u: 1;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--ink); color: var(--paper); font-family: var(--font-ui);
    display: grid; place-items: center; box-sizing: border-box; overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #stage { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgba(243,233,210,.12), 0 20px 60px rgba(0,0,0,.45); }
  canvas { display: block; background: var(--paper); cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #ui {
    position: absolute; inset: 0; color: var(--ink2); font-size: calc(var(--u) * 14px);
    display: flex; flex-direction: column; background: rgba(243,233,210,.93);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  }
  #ui[hidden] { display: none; }
  #ui.clear { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; pointer-events: none; }
  #ui.clear > * { pointer-events: auto; }
  .scr { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 12px); padding: calc(var(--u) * 18px); }
  .center { justify-content: center; align-items: center; text-align: center; }
  .scr.center { overflow-y: auto; overflow-x: hidden; justify-content: flex-start; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .scr.center > * { flex-shrink: 0; }
  .scr.center > :first-child { margin-top: auto; }
  .scr.center > :last-child { margin-bottom: auto; }
  .endbtns { position: sticky; bottom: calc(var(--u)*-18px); z-index: 2; box-sizing: border-box; width: calc(100% + var(--u)*36px); margin-inline: calc(var(--u)*-18px);
    padding: calc(var(--u)*16px) calc(var(--u)*18px) calc(var(--u)*18px); display: flex; justify-content: center;
    background: linear-gradient(to bottom, rgba(243,233,210,0), var(--paper) calc(var(--u)*16px)); }
  .scr.center > .endbtns:last-child { margin-bottom: calc(var(--u)*-18px); }
  .scr.center > .homebar:first-child { position: sticky; top: calc(var(--u)*-18px); left: auto; right: auto; z-index: 3; box-sizing: border-box; width: calc(100% + var(--u)*36px);
    margin: calc(var(--u)*-18px) calc(var(--u)*-18px) 0; padding: calc(var(--u)*14px) calc(var(--u)*16px) calc(var(--u)*8px);
    background: linear-gradient(to top, rgba(243,233,210,0), var(--paper) calc(var(--u)*14px)); }
  .scr.center > .homebar + * { margin-top: auto; }
  .homescr { gap: calc(var(--u)*8px); }
  .homebar ~ .hanko { width: calc(var(--u)*56px); height: calc(var(--u)*56px); font-size: calc(var(--u)*27px); }
  .homebar ~ h1 { font-size: calc(var(--u)*32px); }
  .homebar ~ .stack { gap: calc(var(--u)*8px); }
  .homebar ~ .stack .grid2 .btn { padding-inline: calc(var(--u)*6px); font-size: calc(var(--u)*14px); white-space: nowrap; gap: calc(var(--u)*6px); }
  .passbar { display: flex; align-items: center; gap: calc(var(--u)*10px); width: 100%; max-width: calc(var(--u)*280px); box-sizing: border-box; border: 0; cursor: pointer; text-align: left; font: inherit; color: var(--ink2);
    background: rgba(43,42,40,.08); border-radius: calc(var(--u)*12px); padding: calc(var(--u)*7px) calc(var(--u)*10px); }
  .passbar .k { flex: none; width: calc(var(--u)*28px); height: calc(var(--u)*28px); border-radius: 50%; background: var(--ink2); color: var(--gold); display: grid; place-items: center; font: 800 calc(var(--u)*15px) var(--font-display); }
  .passbar .pb { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: calc(var(--u)*4px); }

  .passhead { background: var(--ink2); color: var(--paper); border-radius: calc(var(--u)*14px); padding: calc(var(--u)*12px); display: flex; flex-direction: column; gap: calc(var(--u)*6px); }
  .passhead i { background: linear-gradient(to right, var(--gold) var(--w), rgba(243,233,210,.15) var(--w)); height: calc(var(--u)*8px); }
  .ptier { display: grid; grid-template-columns: calc(var(--u)*30px) 1fr auto calc(var(--u)*22px); align-items: center; gap: calc(var(--u)*8px); padding: calc(var(--u)*8px) calc(var(--u)*10px); border-radius: calc(var(--u)*12px); background: rgba(43,42,40,.05); }

  .loadbar i { font: 800 calc(var(--u)*15px) var(--font-display); font-style: normal; width: calc(var(--u)*28px); height: calc(var(--u)*28px); border-radius: calc(var(--u)*8px); background: var(--ink2); color: var(--paper); display: grid; place-items: center; }
  .loadbar i.empty { background: transparent; border: 1.5px dashed rgba(43,42,40,.3); color: var(--muted); box-sizing: border-box; }
  .loadbar > b { margin-left: auto; font-size: calc(var(--u)*12px); }
  .loadrow { display: flex; gap: calc(var(--u)*8px); justify-content: center; }

  .loadrow span.on { background: var(--ink2); color: var(--paper); border: 0; }
  .loadrow span.lock { font-size: calc(var(--u)*16px); opacity: .5; }
  .card.pon { border-color: var(--vermilion); }
  .herocard { display: grid; grid-template-columns: calc(var(--u)*64px) 1fr auto; gap: calc(var(--u)*10px); align-items: center; background: var(--paper); border: calc(var(--u)*2px) solid rgba(43,42,40,.15); border-radius: calc(var(--u)*14px); padding: calc(var(--u)*10px); }
  .herocard.on { border-color: var(--vermilion); box-shadow: 0 0 0 calc(var(--u)*2px) rgba(200,68,47,.15); }
  .herocard.lock canvas { filter: grayscale(1) brightness(.6); opacity: .5; }
  .herocard canvas { width: calc(var(--u)*64px); height: calc(var(--u)*68px); }
  .herocard .body { display: flex; flex-direction: column; gap: calc(var(--u)*3px); min-width: 0; }
  .herocard .rank { display: grid; grid-template-columns: auto 1fr auto; gap: calc(var(--u)*6px); align-items: center; font-size: calc(var(--u)*12px); font-weight: 700; }
  .herocard .rank i { height: calc(var(--u)*6px); border-radius: 3px; background: linear-gradient(to right, var(--gold) var(--w), rgba(43,42,40,.12) var(--w)); }
  .playbtn { flex-direction: column; gap: 0; padding: calc(var(--u)*11px) calc(var(--u)*16px); font-size: calc(var(--u)*20px); box-shadow: 0 calc(var(--u)*4px) 0 #8e2a1b; }
  .playbtn small { font-size: calc(var(--u)*11px); font-weight: 500; opacity: .85; }
  .tiles { gap: calc(var(--u)*8px); }
  .tile { position: relative; display: grid; grid-template-columns: calc(var(--u)*30px) 1fr; grid-template-rows: auto auto; column-gap: calc(var(--u)*8px); align-items: center; text-align: left; border: 0; cursor: pointer; font: inherit; color: var(--ink2); background: rgba(43,42,40,.07); border-radius: calc(var(--u)*12px); padding: calc(var(--u)*8px) calc(var(--u)*9px); }
  .tile .k { grid-row: span 2; width: calc(var(--u)*30px); height: calc(var(--u)*30px); border-radius: 50%; background: var(--ink2); color: var(--paper); display: grid; place-items: center; font: 800 calc(var(--u)*15px) var(--font-display); }
  .tile b { font-size: calc(var(--u)*12.5px); line-height: 1.15; }
  .tile > span:not(.k) { font-size: calc(var(--u)*10.5px); color: var(--muted); }
  .tile[disabled] { opacity: .45; cursor: default; }
  .dot { position: absolute; top: calc(var(--u)*-4px); right: calc(var(--u)*-4px); min-width: calc(var(--u)*16px); height: calc(var(--u)*16px); border-radius: 99px; background: var(--vermilion); color: #fff; font: 700 calc(var(--u)*10px)/calc(var(--u)*16px) var(--font-ui); font-style: normal; text-align: center; padding: 0 calc(var(--u)*3px); box-sizing: border-box; }
  .navbar { position: sticky; bottom: calc(var(--u)*-18px); z-index: 3; display: grid; grid-template-columns: repeat(6, 1fr); width: calc(100% + var(--u)*36px); margin: auto calc(var(--u)*-18px) calc(var(--u)*-18px) !important; box-sizing: border-box; padding: calc(var(--u)*7px) calc(var(--u)*6px) calc(var(--u)*10px); background: var(--ink2); border-radius: calc(var(--u)*16px) calc(var(--u)*16px) 0 0; }
  .navbar button { position: relative; border: 0; background: none; color: var(--paper); font: 700 calc(var(--u)*9.5px) var(--font-ui); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*2px); cursor: pointer; padding: calc(var(--u)*3px) 0; border-radius: calc(var(--u)*10px); }
  .navbar button:active { background: rgba(243,233,210,.1); }
  .navbar button[disabled] { opacity: .35; }
  .navbar .k { font: 800 calc(var(--u)*17px) var(--font-display); color: var(--gold); }
  .navbar .dot { top: 0; right: 22%; min-width: calc(var(--u)*9px); height: calc(var(--u)*9px); padding: 0; }
  .logingrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u)*8px); width: 100%; }
  .lday { position: relative; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*3px); background: rgba(43,42,40,.07); border-radius: calc(var(--u)*12px); padding: calc(var(--u)*8px) calc(var(--u)*4px); border: calc(var(--u)*2px) solid transparent; }
  .lday.big { grid-column: span 2; background: linear-gradient(160deg, #3a1410, #1a0c0c); color: var(--paper); }
  .lday.now { border-color: var(--vermilion); background: rgba(200,68,47,.12); animation: pulse 1.4s ease-in-out infinite; }
  .lday.big.now { background: linear-gradient(160deg, #6a1a14, #2a0c0c); }
  .lday.got { opacity: .45; }
  .lday b { font-size: calc(var(--u)*12px); }
  .lday > i { position: absolute; top: calc(var(--u)*4px); right: calc(var(--u)*6px); font-style: normal; color: var(--moss); font-weight: 800; }
  .tourcard { background: linear-gradient(160deg, #2b2a28, #3a1a14); color: var(--paper); border-radius: calc(var(--u)*16px); padding: calc(var(--u)*14px); display: flex; flex-direction: column; gap: calc(var(--u)*8px); }
  .tourcard .top b { font: 800 calc(var(--u)*17px) var(--font-display); }
  .tiers2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u)*6px); }
  .t2 { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u)*2px); background: rgba(243,233,210,.08); border-radius: calc(var(--u)*10px); padding: calc(var(--u)*6px) calc(var(--u)*2px); font-size: calc(var(--u)*10px); }
  .t2 b { font: 800 calc(var(--u)*16px) var(--font-display); }
  .t2.ok { background: rgba(217,164,65,.25); } .t2.got { opacity: .55; }
  .t2 .btn { padding: calc(var(--u)*3px) calc(var(--u)*6px); font-size: calc(var(--u)*10px); }
  .savebox { width: 100%; box-sizing: border-box; height: calc(var(--u)*170px); font: 500 calc(var(--u)*10px)/1.3 ui-monospace, monospace; border-radius: calc(var(--u)*10px); border: 1.5px solid rgba(43,42,40,.25); background: #fffaf0; color: var(--ink2); padding: calc(var(--u)*8px); resize: none; word-break: break-all; -webkit-user-select: text; user-select: text; }
  .ekan { flex: none; width: calc(var(--u)*40px); height: calc(var(--u)*40px); margin: 0 calc(var(--u)*8px); border-radius: 50%; color: #fff; display: grid; place-items: center; font: 800 calc(var(--u)*18px) var(--font-display); }
  .news { display: flex; flex-direction: column; gap: calc(var(--u)*8px); text-align: left; width: 100%; }
  .news div { display: flex; gap: calc(var(--u)*10px); align-items: flex-start; background: rgba(43,42,40,.06); border-radius: calc(var(--u)*12px); padding: calc(var(--u)*8px) calc(var(--u)*10px); }
  .news i { flex: none; font: 800 calc(var(--u)*16px) var(--font-display); font-style: normal; width: calc(var(--u)*30px); height: calc(var(--u)*30px); border-radius: 50%; background: var(--ink2); color: var(--gold); display: grid; place-items: center; }
  .news b { display: block; font-size: calc(var(--u)*13px); } .news span { font-size: calc(var(--u)*11px); color: var(--muted); line-height: 1.35; }
  .gsec { background: rgba(43,42,40,.05); border-radius: calc(var(--u)*12px); }
  .gsec summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: calc(var(--u)*10px); padding: calc(var(--u)*10px); font-weight: 700; font-size: calc(var(--u)*14px); }
  .gsec summary::-webkit-details-marker { display: none; }

  .gsec > div { padding: 0 calc(var(--u)*12px) calc(var(--u)*10px); display: flex; flex-direction: column; gap: calc(var(--u)*6px); font-size: calc(var(--u)*12px); line-height: 1.45; }
  .gsec > div i { color: var(--muted); }
  .tipbox { background: rgba(217,164,65,.16); border-radius: calc(var(--u)*10px); padding: calc(var(--u)*8px) calc(var(--u)*10px); text-align: left; }
  .deco { position: absolute; transform: translate(-50%, 0); width: calc(var(--u)*40px); height: calc(var(--u)*40px); pointer-events: none; opacity: .85; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u)*8px); }

  h1 { font-size: calc(var(--u) * 36px); }

    border: 0; border-radius: calc(var(--u) * 12px); padding: calc(var(--u) * 12px) calc(var(--u) * 16px);

function buildPath(pts) {

  for (let i = 0; i < pts.length - 1; i++) {

}

  const paths = map.paths.map(pts => buildPath(flip ? pts.map(([x, y]) => [W - x, y]) : pts));

    key, world, map: mid, name: map.name, flip, paths, path: paths[0].pts, len: paths[0].len,
    at(d, pi = 0) {
      const P = paths[pi] || paths[0];
      d = Math.max(0, Math.min(P.len, d));
      for (const s of P.segs) if (d <= s.start + s.len) { const k = (d - s.start) / s.len; return [s.x1 + (s.x2 - s.x1) * k, s.y1 + (s.y2 - s.y1) * k]; }
      return P.pts[P.pts.length - 1];
    },

        const k = Math.max(0, Math.min(1, ((x - s.x1) * dx + (y - s.y1) * dy) / (dx * dx + dy * dy)));

  }

}

    return `<div class="scr">
      <div class="top">${back(screenArg && screenArg.from === 'pause' ? 'pause' : 'settings')}<h2>Guide du jardin</h2><span style="width:calc(var(--u)*40px)"></span></div>

        ${sec('始', 'Les bases', '<p>Touche un cercle vide pour planter. Les yōkai suivent le chemin : chacun qui atteint le sanctuaire éteint des lanternes. Plus de lanternes : partie perdue.</p><p>Tu gagnes des pétales en battant des yōkai et à la fin de chaque vague. Lancer la vague suivante en avance rapporte un bonus.</p><p>3 étoiles si tu ne perds aucune lanterne.</p>')}
        ${sec('合', 'Fusion et formes ultimes', '<p>Glisse une plante sur une plante identique de même niveau : elle passe au niveau supérieur (jusqu’à 5). Glisser sur une plante différente échange leurs places.</p><p>Deux niveaux 4 fusionnés donnent une forme ultime :</p>' + ult)}
        ${sec('技', 'Spécialisations (niveau 3)', '<p>Au niveau 3, touche la plante et choisis une voie parmi deux. Le choix est définitif et se garde en fusionnant.</p>' + specs)}
        ${sec('縁', 'Synergies', '<p>Deux plantes différentes côte à côte peuvent se renforcer (un trait doré les relie) :</p>' + syn)}
        ${sec('植', 'Les plantes', plants)}
        ${sec('侍', 'Les héros', '<p>Glisse ton héros (ou touche-le, puis touche le jardin) pour le déplacer. Il monte de niveau en battant des yōkai lui-même, et gagne des rangs permanents au fil des parties. Au Château d’Edo, deux héros combattent ensemble.</p>' + HERO_TYPES.map(t => `<p><b>${CONFIG.heroes[t].name}</b> · ${CONFIG.heroes[t].role}. ${CONFIG.heroes[t].skillName} : ${CONFIG.heroes[t].skillInfo}.</p>`).join(''))}

        ${sec('鎧', 'Yōkai spéciaux', '<p>Le kitsune devient invisible par moments, le shinobi tout le temps : un hōzuki (ou ton héros, de près) les révèle. Les tengu volent : les bonsaïs ne les touchent pas.</p><p>Élites (à partir du niveau 2-6) : ' + Object.values(CONFIG.elites).map(E => `${E.kanji} ${E.name}`).join(', ') + '. Les boss enragent à mi-vie.</p>')}
        ${sec('寺', 'Progression', '<p>Les graines d’or achètent des améliorations permanentes dans les temples (un par monde) et la Maîtrise de chaque plante. Les étoiles, le mode Difficile, l’Infernal, les succès, les quêtes et le tournoi en rapportent.</p><p>Le jade et les fragments servent aux apparences. Le défi du jour et les quêtes changent chaque matin à 8 h.</p>')}
      </div>
    </div>`;
  },
  news() {
    const items = [['侍', 'Deux héros', 'Kenji au sabre et Aya la kunoichi, avec des rangs permanents et des apparences.'], ['技', 'Spécialisations', 'Au niveau 3, chaque plante choisit une voie parmi deux.'], ['鎧', 'Yōkai d’élite et boss enragés', 'Auras de pouvoirs, et des boss qui changent de tactique à mi-vie.'], ['任', 'Quêtes du jour et cadeau quotidien', 'Trois quêtes chaque matin, un coffre impérial au 7e jour.'], ['挑', 'Défis de niveau et tournoi', 'Un défi par niveau, et un tournoi chaque semaine.'], ['保', 'Sauvegarde exportable', 'Dans les paramètres : un code pour ne jamais perdre ta partie.']];
    return `<div class="scr center">
      <h2>Quoi de neuf ?</h2>
      <div class="news">${items.map(([k, b, t]) => `<div><i>${k}</i><p><b>${b}</b><span>${t}</span></p></div>`).join('')}</div>

  quests() {

      return `<div class="card" style="cursor:default${got ? ';opacity:.6' : ''}"><div class="k ${done ? 'gold' : ''}">${q.kanji}</div><div class="body"><b>${q.name}</b><span>${pr}/${q.need} · ${rewardIcon(r)} ${r.n} + 20 d’honneur</span><div class="bar"><i style="width:${pr / q.need * 100}%"></i></div></div>
        ${got ? '<span class="small" style="flex:none;font-weight:700">Reçu ✓</span>' : done ? `<button class="btn sm red" data-act="claimq" data-i="${i}" style="flex:none">Récupérer</button>` : '<span class="small muted" style="flex:none">En cours</span>'}</div>`;

      <div class="top">${back()}<h2>Quêtes du jour</h2><span style="width:calc(var(--u)*40px)"></span></div>

      <div class="list">${rows}
        <div class="card" style="cursor:default;border-style:dashed"><div class="k red">宝</div><div class="body"><b>Bonus : les 3 quêtes</b><span>Un coffre de bambou</span></div>

      </div>

  },
  login() {

  daily() {

  collection() {

        return `<button class="skin${eq === o.id ? ' on' : ''}" style="--rc:${rc}" data-act="equip" data-t="${t}" data-s="${o.id}" ${own ? '' : 'disabled'} aria-pressed="${eq === o.id}"><canvas data-prev="${t}:${o.id}"></canvas>${o.r ? `<i class="rtag" style="--rc:${rc}">${RAR[o.r].name}</i>` : ''}<span>${own ? o.name : o.ev ? `Événement ${EVENTS.find(e => e.id === o.ev).name}` : '???'}</span></button>`;
      }).join('')}</div></div>`;

      <div class="chestbox"><div class="k">宝</div><div class="body"><b>${n} coffre${n > 1 ? 's' : ''} à ouvrir</b><span>${SAVE.chests} de bambou · ${SAVE.chestsImp} impérial${SAVE.chestsImp > 1 ? 'aux' : ''}</span></div>
        ${SAVE.chestsImp ? `<button class="btn sm" data-act="open" data-c="imperial" data-n="1" data-p="owned">Ouvrir</button>` : SAVE.chests ? `<button class="btn sm" data-act="open" data-c="bambou" data-n="1" data-p="owned">Ouvrir</button>` : `<button class="btn sm" data-act="store">Boutique</button>`}</div>

  store() {
    const tab = (screenArg && screenArg.tab) || 'chests', conf = screenArg && screenArg.confirm;

      .map(([k, l]) => `<button class="tab${k === tab ? ' on' : ''}" data-act="storetab" data-tab="${k}">${l}</button>`).join('');
    const jadeH = n => `<span class="cur"><i class="jade"></i>${n}</span>`, fragH = n => `<span class="cur"><i class="frag"></i>${n}</span>`;

      const card = (id) => {
        const ch = CONFIG.chests[id], imp = id === 'imperial', isEv = id === 'event', own = (imp ? SAVE.chestsImp : isEv ? SAVE.chestsEv : SAVE.chests) || 0;
        return `<div class="chestcard${imp ? ' imp' : ''}${isEv ? ' evc' : ''}">
          <div class="row1"><div class="mini"><div class="chest${imp ? ' imp' : ''}${isEv ? ' evch' : ''}" style="position:relative"><div class="lid"></div><div class="base"><div class="lock">${ch.kanji}</div></div></div></div>
            <div><b>${ch.name}</b><span>${isEv ? `4 apparences exclusives, disponibles jusqu’au ${EVT.until} (elles restent à toi ensuite).` : imp ? 'Aucune apparence commune. Meilleures chances de Légendaire et de Mythique.' : 'Une apparence au hasard, de Commune à Mythique.'} Possédés : ${own}</span></div></div>
          <div class="buys">
            ${own ? `<button class="btn gold" data-act="open" data-c="${id}" data-n="1" data-p="owned">Ouvrir (${own})</button>` : ''}

            ${ch.seeds ? `<button class="btn" data-act="open" data-c="${id}" data-n="1" data-p="seeds" ${SAVE.seeds >= ch.seeds ? '' : 'disabled'}>${seedsHtml(ch.seeds)}</button>` : ''}

            <button class="btn" data-act="open" data-c="${id}" data-n="10" data-p="jade" ${SAVE.jade >= ch.jade10 ? '' : 'disabled'}>×10 · ${jadeH(ch.jade10.toLocaleString('fr-FR'))}</button>
          </div>
          <details class="odds"><summary>Voir les taux de base</summary><table>${CONFIG.rarities.map((r, k) => `<tr><td><i class="rtag" style="--rc:${r.color}">${r.name}</i></td><td>${(ch.rates[k] * 100).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} %</td></tr>`).join('')}</table></details>
        </div>`;
      };
      body = `<div class="store-chests">${EVT ? card('event') : ''}${card('bambou')}${card('imperial')}
        <p class="note">Garantie : une apparence Épique ou mieux au plus tard tous les ${CONFIG.pity.epic} coffres (encore ${Math.max(1, CONFIG.pity.epic - SAVE.pity.e)}), une Légendaire ou mieux tous les ${CONFIG.pity.leg} (encore ${Math.max(1, CONFIG.pity.leg - SAVE.pity.l)}). Grâce à la garantie, les taux réels moyens du coffre de bambou sont d\u2019environ 5 % pour Légendaire et 1 % pour Mythique. Un doublon se transforme en fragments : ${CONFIG.rarities.map(r => `${r.dup} pour ${r.name.toLowerCase()}`).join(', ')}.</p></div>`;
    } else if (tab === 'offers') {
      const h = 24 - new Date().getHours();

          const r = RAR[o.r], own = ownsSkin(t, o.id), key = `frags:${t}:${o.id}`;
          return `<div class="offer" style="--rc:${r.color}"><canvas data-prev="${t}:${o.id}"></canvas><i class="rtag">${r.name}</i><b>${o.name}</b>
            ${own ? '<span class="small muted">Possédée</span>' : `<button class="btn ${conf === key ? 'red' : ''}" data-act="buyskin" data-k="${key}" ${SAVE.frags >= r.frags ? '' : 'disabled'}>${conf === key ? 'Confirmer' : fragH(r.frags.toLocaleString('fr-FR'))}</button>`}</div>`;

        <p class="note">Les achats en argent réel arriveront avec la version mobile (Google Play et App Store). En attendant, le jade se gagne en jouant : 5 par niveau à 3 étoiles, 10 par défi du jour, 15 par succès et 15 par palier Infernal.</p>`;

  },
  opening() {
    const a = screenArg, res = a.results, multi = res.length > 1;

  bestiary() {

  achievements() {

  else if (act === 'claimtour') { tourInfo(); const T = SAVE.tour, i = +el.dataset.i; if (T.best >= TOUR_TIERS[i].w && !T.claimed[i]) { T.claimed[i] = 1; grantReward(TOUR_TIERS[i].r); persist(); sfx.chest(); } show('infini'); }
  else if (act === 'export') show('savecode', { mode: 'export' });
  else if (act === 'import') show('savecode', { mode: 'import' });
  else if (act === 'copysave') { const ta = document.getElementById('savebox'); ta.select(); try { navigator.clipboard.writeText(ta.value).then(() => { el.textContent = 'Copié !'; }, () => { document.execCommand('copy'); el.textContent = 'Copié !'; }); } catch (e) { document.execCommand('copy'); el.textContent = 'Copié !'; } }
  else if (act === 'loadsave') {
    const msg = document.getElementById('savemsg');
    try { const txt = document.getElementById('savebox').value.trim(); const v = JSON.parse(decodeURIComponent(escape(atob(txt)))); if (!v || v.v !== 2 || !v.stars) throw 0;
      if (el.dataset.ok !== '1') { el.dataset.ok = '1'; el.textContent = 'Confirmer : remplacer ma partie'; el.classList.add('red'); msg.textContent = `Code valide : ${Object.values(v.stars).reduce((a, b) => a + b, 0)} étoiles, ${v.seeds || 0} graines. Ta progression actuelle sera remplacée.`; return; }
      localStorage.setItem('jds_save2', JSON.stringify(v)); location.reload();
    } catch (e) { msg.textContent = 'Ce code n’est pas valide. Vérifie que tu l’as copié en entier.'; }
  }
  else if (act === 'daily') show('daily');
  else if (act === 'playdaily') startDaily();
  else if (act === 'collection') { if (S.mode !== 'idle') { flushStats(); goIdle(); } show('collection', {}); }
  else if (act === 'open') { if (S.mode !== 'idle') { flushStats(); goIdle(); } openChests(el.dataset.c, +el.dataset.n, el.dataset.p); }
  else if (act === 'skipopen') skipOpening();
  else if (act === 'freechest') { if (Date.now() >= (SAVE.freeAt || 0)) { SAVE.freeAt = Date.now() + 4 * 3600e3; SAVE.chests++; persist(); openChests('bambou', 1, 'owned'); } }
  else if (act === 'tapchest') tapChest();
  else if (act === 'equipnew') { SAVE.equip[el.dataset.t] = el.dataset.s; persist(); show('collection', {}); }
  else if (act === 'store') { if (S.mode !== 'idle') { flushStats(); goIdle(); } show('store', { tab: 'chests' }); }
  else if (act === 'storetab') show('store', { tab: el.dataset.tab });
  else if (act === 'buyskin') {
    const [cur, t, id] = el.dataset.k.split(':'), sk = skinOf(t, id), r = RAR[sk.r], price = cur === 'jade' ? r.jade : r.frags, tab = screenArg.tab;
    if (screenArg.confirm !== el.dataset.k) { show('store', { tab, confirm: el.dataset.k }); return; }
    if (SAVE[cur] >= price && !ownsSkin(t, id)) { SAVE[cur] -= price; SAVE.skins[`${t}:${id}`] = 1; persist(); checkAch(); sfx.chest(); }
    show('store', { tab });
  }
  else if (act === 'equip') { const t = el.dataset.t, sk = el.dataset.s; if (sk) SAVE.equip[t] = sk; else delete SAVE.equip[t]; persist(); sfx.click(); const sc = ui.querySelector('.list')?.scrollTop || 0; show('collection', {}); const li = ui.querySelector('.list'); if (li) li.scrollTop = sc; }
  else if (act === 'bestiary') show('bestiary');
  else if (act === 'achievements') show('achievements');
  else if (act === 'shop') show('shop');
  else if (act === 'settings') { screenArg = 'home'; show('settings', 'home'); }
  else if (act === 'settingsP') show('settings', 'pause');
  else if (act === 'pause') show('pause');
  else if (act === 'heroes') show('heroes');
  else if (act === 'quests') show('quests');
  else if (act === 'guide') show('guide', { from: 'settings' });
  else if (act === 'guideP') show('guide', { from: 'pause' });
  else if (act === 'claimq') { const Q = getQuests(), i = +el.dataset.i, qq = Q.list[i], q = QUESTS.find(x => x.id === qq.id); if (!Q.claimed[i] && questProg(qq) >= q.need) { Q.claimed[i] = 1; grantReward(QREWARDS[i % 3]); passXp(20); HONOR = null; persist(); sfx.chest(); } show('quests'); }
  else if (act === 'claimqb') { const Q = getQuests(); if (!Q.bonus && Q.list.every((_, i) => Q.claimed[i])) { Q.bonus = true; SAVE.chests++; persist(); show('store', { tab: 'chests' }); return; } show('quests'); }
  else if (act === 'claimlogin') { const L = SAVE.login = SAVE.login || { last: '', day: 0 }; if (L.last !== dailyKey()) { grantReward(LOGIN[L.day % 7]); L.last = dailyKey(); L.day++; persist(); sfx.chest(); } show('home'); }
  else if (act === 'pickhero') { SAVE.heroSel = el.dataset.t; persist(); sfx.skill(); show('heroes'); }
  else if (act === 'powers') show('powers', { w: el.dataset.w != null ? +el.dataset.w : null, i: el.dataset.i != null ? +el.dataset.i : null });
  else if (act === 'togglepw') {
    const id = el.dataset.id; let L = loadout();
    if (L.includes(id)) { if (L.length > 1) L = L.filter(x => x !== id); } else if (L.length < powerSlots()) L.push(id);
    SAVE.loadout = L; persist(); sfx.click(); const sc = ui.querySelector('.list')?.scrollTop || 0; show('powers'); const li = ui.querySelector('.list'); if (li) li.scrollTop = sc;
  }
  else if (act === 'pass') { show('pass'); const li = document.getElementById('passlist'), r = li && li.querySelector('.ptier.ok:not(.got)') || li && li.querySelectorAll('.ptier.got')[passTier() - 1]; if (r) li.scrollTop = r.offsetTop - li.offsetTop - 60; }
  else if (act === 'claim' || act === 'claimall') {
    const t = passTier(), ids = act === 'claim' ? [+el.dataset.i] : Array.from({ length: t }, (_, i) => i).filter(i => !SAVE.pass.claimed[i]);
    for (const i of ids) if (i < t && !SAVE.pass.claimed[i]) { SAVE.pass.claimed[i] = 1; grantReward(passReward(i)); }
    persist(); sfx.chest(); const sc = document.getElementById('passlist')?.scrollTop || 0; show('pass'); const li = document.getElementById('passlist'); if (li) li.scrollTop = sc;
  }
  else if (act === 'shoptab') { const t = el.dataset.t; shopTab = t === 'm' ? 'm' : +t; sfx.click(); show('shop'); }
  else if (act === 'buy') {
    const u = CONFIG.upgrades.find(u => u.id === el.dataset.id), l = upLvl(u.id);
    if (l < u.costs.length && SAVE.seeds >= u.costs[l]) { SAVE.seeds -= u.costs[l]; SAVE.up[u.id] = l + 1; persist(); sfx.skill(); const sc = ui.querySelector('.list')?.scrollTop || 0; show('shop'); const li = ui.querySelector('.list'); if (li) li.scrollTop = sc; }
  }
  else if (act === 'askreset') { confirmReset = true; show('settings'); }
  else if (act === 'cancelreset') { confirmReset = false; show('settings'); }
  else if (act === 'doreset') { const keep = SAVE.settings; Object.assign(SAVE, DEFAULT_SAVE(), { settings: keep }); for (const k of ['stars', 'hard', 'inf', 'skins', 'equip', 'ach', 'seenE', 'seen', 'up']) SAVE[k] = {}; persist(); confirmReset = false; mapWorld = 0; goIdle(0); show('home'); }
  else if (act === 'resume') show('none');
  else if (act === 'restart') { flushStats(); if (S.daily) startDaily(); else if (S.mode === 'endless' && S.tour) startTour(); else if (S.mode === 'endless') startEndless(); else startLevel(S.world, S.level, S.diff, S.tier); }
  else if (act === 'quit') { flushStats(); const toHome = S.mode === 'endless' || S.daily; mapWorld = S.world; goIdle(mapWorld); show(toHome ? 'home' : 'map'); }
  else if (act === 'pick') { takeSkill(el.dataset.id); show('none'); if (SAVE.settings.auto) S.autoT = 2; }
  else if (act === 'reroll') { S.rerolls--; show('skills', { choices: rollSkills() }); }
});
ui.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.set) { SAVE.settings[t.dataset.set] = t.checked; persist(); applyVolumes(); }
});
ui.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.range) {
    SAVE.settings[t.dataset.range] = +t.value; persist(); applyVolumes();
    const hint = t.parentElement.querySelector('.hint'); if (hint) hint.textContent = t.value + ' %';
  }
});

/* ---------- boucle ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (screen === 'none' && S.mode !== 'idle') {
    if (S.slowmo > 0) S.slowmo -= dt;
    let sim = dt * S.speed * (S.slowmo > 0 ? 0.3 : 1);
    while (sim > 0) { const step = Math.min(sim, 1 / 60); update(step); sim -= step; }
    updateFx(dt * Math.min(S.speed, 1.5));
  } else S.t += dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 30);
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt);
  musicTick(dt);
  render(dt);
  requestAnimationFrame(frame);
}
window.__JDS = { get S() { return S; }, set S(v) { S = v; }, CONFIG, SAVE, GEOS };
window.addEventListener('resize', () => { resize(); sizeFx(); });
resize();
show('home');
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { bgWorld = ''; });
requestAnimationFrame(frame);
})();
</script>
